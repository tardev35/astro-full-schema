# Astro static-site rules for an aaPanel site.
#
# deploy-aapanel.ps1 uploads this file to
#   /www/server/panel/vhost/nginx/extension/<domain>/astro.conf
# which the panel's own vhost already includes from inside its server { } block.
# Nothing in here names a domain, so the same file fits every site, and the
# panel can rewrite its vhost without wiping these rules.
#
# The panel's vhost already sets root, index and error_page 404 /404.html, and
# it defines no location / of its own — which is what leaves room for this.

location / {
    try_files $uri $uri/ $uri.html =404;
}

# /_astro/* filenames carry a content hash and /fonts/* never change, so both are
# safe to freeze for a year. This is the nginx half of public/_headers, which is
# read by Cloudflare only and does nothing on this server.
#
# ^~ is load-bearing: it stops nginx evaluating the panel's regex locations, one
# of which would otherwise cap every .js/.css here at 12 hours. Declaring
# add_header inside a location drops the ones inherited from the server block,
# so HSTS is repeated rather than lost.
location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000";
    access_log off;
}

location ^~ /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000";
    access_log off;
}

# The build ships no PHP at all, so anything asking for it is a probe.
location ~ \.php$ {
    return 404;
}
